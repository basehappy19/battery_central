# Local/test Mosquitto config for the Docker Compose `mosquitto` service.
#
# This intentionally allows anonymous connections so you can test the MQTT
# pipeline (mosquitto -> scripts/mqtt-listener.js -> POST /api/battery/update)
# on your own machine without setting up passwords first. It is NOT the
# config to use on a public VPS — see the "MQTT (Mosquitto) Setup on a Cloud
# VPS" section in README.md for the authenticated production setup
# (password file + firewalled port).

listener 1883
protocol mqtt
allow_anonymous true

# WebSocket listener, handy for testing from a browser-based MQTT client
# (e.g. MQTT Explorer's web client, or hivemq's public websocket test tool)
# without installing anything locally.
listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
